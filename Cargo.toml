[package]
name = "sloptyper"
version = "0.1.0"
edition = "2021"
description = "TUI Hacker Typer utility - AI-powered keystroke injection"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1.19"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
lazy_static = "1.4"
axum = "0.7"
futures-util = "0.3"
crossterm = "0.27"
clap = { version = "4.4", features = ["derive"] }
arboard = "3.3"
is-terminal = "0.4"
libc = "0.2"
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "handleapi", "fileapi"] }